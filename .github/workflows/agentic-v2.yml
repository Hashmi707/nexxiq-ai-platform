name: Agentic Social V2

permissions:
  contents: read
  security-events: write

on:
  pull_request:
  push:
    branches:
      - main
      - agentic-social-v2

jobs:
  agentic-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: NexxIQ Platform Tests
        run: npm run test:nexxiq

      - name: Static agentic architecture audit
        run: npm run test:agentic

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Syntax check
        run: |
          node --check agentic-social.js
          node --check src/server.js
          node --check src/api/routes.js
          node --check src/agent/universal-browser-agent.js
          node --check src/agent/visual-fallback.js
          node --check src/agentic/next-best-action.js
          node --check src/leads/lead-engine.js
          node --check src/email/smtp-service.js
          node --check src/resume/resume-enhancer.js
          node --check src/orchestrator/unified-workflow.js
          node --check src/safety/global-guard.js
          node --check src/safety/social-action-policy.js
          node --check src/social/agentic-social-runner.js
          node --check src/content/omnichannel-content.js
          node --check src/ai/ai-runtime.js
          node --check scripts/launch-browser-cdp.js
          node --check scripts/android-chrome-cdp.js
